<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dcebf2"><meta name="description" content="一只纸风车，一阵彩色的风。从白昼到日落，慢慢把时间交给风。"><title>纸风车</title><link rel="stylesheet" href="pinwheel.css?v=12"></head><body>
<main id="scene" aria-label="纸风车与随风飞舞的彩纸，白天逐渐过渡到日落">
<div class="landscape"></div><div id="evening" class="evening"></div><div id="sunlight" class="sunlight"></div>
<div id="weatherShade" aria-hidden="true"></div><div id="clouds" aria-hidden="true"></div><canvas id="air" aria-hidden="true"></canvas>
<div id="assembly" class="assembly" aria-hidden="true"><div class="stick"></div><div id="rotor" class="rotor"><canvas id="paperRotor"></canvas><img id="paperSource" src="assets/pinwheel.webp" alt="" draggable="false"></div><div class="axle"></div></div>
<canvas id="near" aria-hidden="true"></canvas><div class="vignette"></div>
<footer><div class="time-control"><span class="sun-icon" aria-hidden="true">☼</span><input id="day" aria-label="调整白昼到日落" type="range" min="0" max="100" value="0"><span class="sun-icon" aria-hidden="true">◒</span></div><div class="buttons"><button id="gust" class="gust" aria-label="吹起一阵风"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h12a3 3 0 1 0-3-3M3 12h16a2.5 2.5 0 1 1-2.5 2.5M3 16h6a2 2 0 1 1-2 2"/></svg></button><button id="sound" class="pause" aria-label="关闭声音（等待点击页面后播放）" aria-pressed="true"><svg id="soundIcon" viewBox="0 0 24 24" aria-hidden="true"></svg></button><button id="pause" class="pause" aria-label="暂停动画" aria-pressed="false"><svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button></div></footer>
</main><script src="scene.js?v=15"></script><script src="source-audio.js?v=4"></script></body></html>
