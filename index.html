<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090610">
  <meta name="description" content="一颗由紫色星尘汇聚而成、不断跳动的爱心。">
  <title>紫色心跳</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23c88bff' d='M16 29C11 24 2 19 2 11a7.5 7.5 0 0 1 14-4 7.5 7.5 0 0 1 14 4c0 8-9 13-14 18Z'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; background: #090610; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    main {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 44%, #1d1029 0%, #110a1c 34%, transparent 68%),
        radial-gradient(ellipse at 70% 90%, #110819, #08060e 68%);
    }
    canvas { display: block; width: 100%; height: 100%; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    button:focus-visible { outline: 1px solid #dcb5ff; outline-offset: 5px; }
    .heart {
      position: absolute;
      left: 50%;
      top: 47%;
      width: min(70vw, 57vh, 490px);
      aspect-ratio: 1.15;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 48%;
      background: transparent;
      cursor: pointer;
    }
    .replay {
      position: absolute;
      bottom: max(clamp(24px, 6vh, 62px), calc(env(safe-area-inset-bottom) + 16px));
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid #b991e330;
      border-radius: 99px;
      background: #190f23b3;
      color: #cbb8df;
      font-size: 12px;
      letter-spacing: .16em;
      white-space: nowrap;
      cursor: pointer;
      transition: background .25s, border-color .25s, color .25s;
    }
    .replay:hover { background: #281637; border-color: #b991e370; color: #f3e4ff; }
    .replay svg { width: 14px; height: 14px; }
    @media (prefers-reduced-motion: reduce) { .replay { transition: none; } }
    .fallback {
      position: absolute;
      left: 50%;
      top: 47%;
      width: min(74vw, 60vh, 500px);
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 30px #a45ffb80);
    }
  </style>
</head>
<body>
  <main aria-label="紫色心跳">
    <canvas aria-hidden="true"></canvas>
    <button class="heart" type="button" aria-label="触碰爱心" hidden></button>
    <button class="replay" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2 6m-2-6V5m0 6h6"/></svg>
      重播
    </button>
    <svg class="fallback" viewBox="0 0 32 32" role="img" aria-label="紫色爱心">
      <defs><linearGradient id="violet" x2="1" y2="1"><stop stop-color="#e4c6ff"/><stop offset="1" stop-color="#8744cf"/></linearGradient></defs>
      <path fill="url(#violet)" d="M16 29C11 24 2 19 2 11a7.5 7.5 0 0 1 14-4 7.5 7.5 0 0 1 14 4c0 8-9 13-14 18Z"/>
    </svg>
  </main>
  <script src="heart.js?v=4" defer></script>
</body>
</html>
