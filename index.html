<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<meta name="theme-color" content="#070a18" />
<meta name="description" content="轻量级流光爱心动画，GitHub Pages 部署测试页面" />
<title>流光 · GitHub Pages 测试</title>
<style>
:root{color-scheme:dark;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow:hidden;background:#070a18;color:#ecf0ff}
body{min-height:100svh;background:radial-gradient(ellipse 70% 55% at 50% 48%,#1a183c 0,#0d1025 48%,#070a18 85%)}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;pointer-events:none}
.page{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;isolation:isolate}
.content{position:relative;z-index:1;transform:translateY(min(28vh,220px));animation:rise 1.1s .3s both}
.tag{display:inline-flex;align-items:center;gap:8px;border:1px solid #ffffff29;background:#ffffff0b;border-radius:999px;padding:8px 14px;font-size:11px;letter-spacing:.17em;color:#bfc4e6;backdrop-filter:blur(12px)}
.dot{height:6px;width:6px;display:inline-block;border-radius:50%;background:#89f5de;box-shadow:0 0 12px #89f5de}
h1{font-size:clamp(28px,5vw,53px);letter-spacing:.1em;font-weight:580;margin:18px 0 9px;text-shadow:0 4px 28px #edc2ff33}
p{font-size:clamp(12px,2vw,14px);color:#a6adca;letter-spacing:.1em;line-height:1.8;margin:0}
@keyframes rise{from{opacity:0;transform:translateY(calc(min(28vh,220px) + 16px))}to{opacity:1;transform:translateY(min(28vh,220px))}}
@media(prefers-reduced-motion:reduce){.content{animation:none} }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<main class="page"><section class="content"><span class="tag"><span class="dot"></span> GITHUB PAGES · ONLINE DEMO</span><h1>心动，在光里发生</h1><p>一页 HTML · 无依赖 · 轻量粒子动画</p></section></main>
<script>
(()=>{
  'use strict';
  const canvas=document.getElementById('scene');
  const ctx=canvas.getContext('2d',{alpha:true});
  if(!ctx)return;
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU=Math.PI*2;
  let W=0,H=0,dpr=1,particles=[],stars=[],start=performance.now(),last=0;
  const count=reduceMotion?110:240;
  const rand=(a,b)=>a+Math.random()*(b-a);
  function heart(t){return {x:16*Math.pow(Math.sin(t),3),y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))};}
  function resize(){
    W=window.innerWidth;H=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.min(100,Math.floor(W*H/10500))},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.25,1.1),a:rand(.08,.35),phase:rand(0,TAU)}));
    particles=Array.from({length:count},(_,i)=>({t:TAU*i/count+rand(-.04,.04),s:rand(.62,1.18),size:rand(.7,2.5),phase:rand(0,TAU),offset:rand(-.95,.95),a:rand(.35,.95),trail:rand(.01,.08)}));
  }
  function draw(now){
    if(!reduceMotion&&now-last<16){requestAnimationFrame(draw);return;}last=now;
    const time=(now-start)*.001;
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ctx.globalAlpha=s.a*(.8+.2*Math.sin(time*.9+s.phase));ctx.fillStyle='#c0c6ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,TAU);ctx.fill();}
    ctx.globalAlpha=1;
    const scale=Math.min(W/42,H/44,18)*.82;
    const cx=W*.5,cy=H*.405;
    const intro=reduceMotion?1:Math.min(1,time/1.65);
    const ease=1-Math.pow(1-intro,3);
    const beat=1+.018*Math.sin(time*2.65);
    const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*19);
    glow.addColorStop(0,'rgba(211,93,188,.08)');glow.addColorStop(.42,'rgba(126,91,227,.035)');glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,scale*19,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='lighter';
    for(const p of particles){
      const ht=heart(p.t+(reduceMotion?0:time*p.trail));
      const jitter=reduceMotion?0:Math.sin(time*1.3+p.phase)*.42;
      const x=cx+(ht.x*scale*beat*p.s+jitter)*ease;
      const y=cy+(ht.y*scale*beat*p.s+jitter)*ease;
      const fromX=cx+(Math.cos(p.phase)*W*.65)*(1-ease);
      const fromY=cy+(Math.sin(p.phase)*H*.65)*(1-ease);
      const px=x*ease+fromX*(1-ease),py=y*ease+fromY*(1-ease);
      const hue=325+40*Math.sin(p.t*1.3+p.offset);
      ctx.shadowBlur=p.size*7;ctx.shadowColor=`hsla(${hue},95%,77%,.7)`;
      ctx.fillStyle=`hsla(${hue},97%,82%,${p.a})`;
      ctx.beginPath();ctx.arc(px,py,p.size*(.6+.4*ease),0,TAU);ctx.fill();
    }
    ctx.shadowBlur=0;ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    if(!reduceMotion)requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize,{passive:true});
  resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
