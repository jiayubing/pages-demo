<script>
'use strict';

// Violet / 05.1 — cooler blue-violet grading + softer internal filaments + visible dreamy ornaments.
// Canonical WebGL2 viewer, rendered at the site root.
(() => {
  const canvas = document.getElementById('scene');
  const errorBox = document.getElementById('error');
  const qualitySelect = document.getElementById('quality');
  const qualityLabel = document.getElementById('quality-now');
  const fpsLabel = document.getElementById('fps');
  const playButton = document.getElementById('play');
  const replayButton = document.getElementById('replay');
  const notice = document.getElementById('notice');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  if (reducedMotion.matches) notice.textContent = '已遵循系统减少动画设置 · 点击「继续」播放';
  const presets = {
    low:    { shell: 1750, fibers: 300, rim: 240, stars: 72, dust: 35, orbit: 42, pearls: 10, dpr: 1.05 },
    medium: { shell: 3000, fibers: 575, rim: 400, stars: 120, dust: 65, orbit: 84, pearls: 18, dpr: 1.3 },
    high:   { shell: 4900, fibers: 860, rim: 650, stars: 165, dust: 95, orbit: 124, pearls: 28, dpr: 1.6 },
  };
  const labels = { low: '流畅', medium: '均衡', high: '精细' };
  const TAU = Math.PI * 2;
  const centerY = .075;
  let gl, program, backgroundProgram, surfaceProgram, ribbonProgram;
   let vao, buffer, fullscreenVao, surfaceVao, ribbonVao, surfaceIndexCount;
  let particleUniforms, backgroundUniforms, surfaceUniforms, ribbonUniforms;
  let particleCount = 0;
  let tier = 'medium', auto = true, running = !reducedMotion.matches;
  let elapsed = reducedMotion.matches ? 8 : 0;
  let clock = 0, lastTime = 0, pulseTime = -100;
  let pulseX = 0, pulseY = .065;
  let width = 1, height = 1, pixelRatio = 1, unit = 200;
  let mouseX = 0, mouseY = 0, smoothX = 0, smoothY = 0;
  let raf = 0, fpsWindow = 0, frames = 0, slowWindows = 0, fastWindows = 0, lastTierChange = 0;
  let hidden = document.hidden, disposed = false;
  const streams = [ [-.93,.46,1.1],[-.48,.35,2.4],[0,.26,4.8],[.48,-.37,3.2],[.93,-.48,5.6] ];
  const contour = makeContour();

  const vertexSource = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
layout(location=1) in vec3 aTarget;
layout(location=2) in vec3 aStart;
layout(location=3) in vec4 aMeta;  // diameter, phase, speed, palette
layout(location=4) in vec4 aExtra; // delay, duration, opacity, kind
uniform vec2 uViewport;
uniform float uUnit;
uniform float uElapsed;
uniform float uTime;
uniform float uPulseAge;
uniform vec2 uPulseOrigin;
uniform mat3 uRotation;
out vec2 vUv;
out vec3 vColor;
out float vAlpha;
out float vGlint;
out float vKind;
const float PI=3.14159265359;
vec3 palette(float c){
  if(c<.5) return vec3(.28,.17,.47);
  if(c<1.5) return vec3(.43,.33,.73);
  if(c<2.5) return vec3(.50,.56,.88);
  if(c<3.5) return vec3(.70,.76,.97);
  if(c<4.5) return vec3(.94,.92,1.0);
  return vec3(.62,.44,.82);
}
float centerY(float y,float r){return .075+(y-.075)*r;}
vec2 heart(float t){
  float s=sin(t);
  return vec2(s*s*s,(-13.0*cos(t)+5.0*cos(2.0*t)+2.0*cos(3.0*t)+cos(4.0*t)-2.4)/16.0);
}
void main(){
  float kind=aExtra.w;
  float alpha=aExtra.z;
  float size=aMeta.x;
  vec3 pos=aTarget;
  float phase=aMeta.y;
  float t=uTime;
  vUv=aCorner;
  vec2 clip;
  float perspective=1.0;
  float light=1.0;
  float glint=0.0;
  vKind=kind;
  if(kind>1.5 && kind<2.5){
    // Background stars use normalized screen coordinates, not model coordinates.
    clip=aTarget.xy*2.0-1.0;
    alpha*=.72+.28*sin(t*1.23+phase);
    size*=.85+.15*sin(t*.7+phase);
  } else if(kind>5.5 && kind<6.5){
    // Pearly near-camera bokeh: a few soft lights drifting in front of the sculpture.
    clip=aTarget.xy*2.0-1.0;
    clip+=vec2(sin(t*.08+phase)*.018+aStart.x*.016,
               cos(t*.06+phase)*.013+aStart.z*.018);
    clip+=vec2(uPulseOrigin.x,uPulseOrigin.y-.065)*.028;
    alpha*=smoothstep(3.0,5.5,uElapsed)*(.72+.28*sin(t*.37+phase));
    size*=2.05+aTarget.z*1.70;
  } else {
    if(kind>4.5 && kind<5.5){
       // Sparse, tilted 3D orbit: individual grains, never a bright neon ring.
       float a=aTarget.x+t*aMeta.z*.16;
       float orbitRadius=aTarget.y;
       pos=vec3(cos(a)*orbitRadius,
                sin(a)*.28+cos(a)*.18+aStart.x,
                sin(a)*.72+aTarget.z);
       alpha*=smoothstep(3.0,5.2,uElapsed)*(.67+.33*sin(t*.65+phase));
       alpha*=.70;
       size*=.86;
     } else if(kind>.5 && kind<1.5){
      float a=aTarget.x+t*aMeta.z*.15;
      float r=aTarget.y+sin(t*2.0+phase)*.012;
      vec2 e=heart(a);
      pos=vec3(e.x*r,centerY(e.y,r),aTarget.z);
      // Three restrained travelling highlights; no extra particles or passes.
      float band=pow(.5+.5*cos((a-t*.20)*18.0),11.0);
      alpha*=.43+.97*band;
      size*=.92+.31*band;
      light+=band*.19;
      alpha*=smoothstep(2.55,4.2,uElapsed);
    } else if(kind>2.5 && kind<3.5){
      pos.x+=sin(t*.20+phase)*.03;
      pos.y+=cos(t*.17+phase)*.05;
      alpha*=.73+.27*sin(t*.9+phase);
      alpha*=smoothstep(2.0,5.0,uElapsed);
    } else {
      float local=clamp((uElapsed-aExtra.x)/max(aExtra.y,.1),0.0,1.0);
      float progress=local*local*(3.0-2.0*local);
      // A slight settling motion at the end of the gathering, without extra physics.
      progress+=.014*sin(PI*clamp((local-.75)/.25,0.0,1.0))*smoothstep(.72,.87,local);
      float curl=sin(PI*local)*pow(1.0-local,.5);
      pos=mix(aStart,aTarget,progress);
      pos.x+=curl*(sin(local*8.0+phase)*.27 +sin(local*6.2831853)*aStart.z*.17);
      pos.z+=curl*cos(local*7.0+phase)*.16;
      float ripple=sin(aTarget.x*8.0+aTarget.y*10.0-t*2.1+phase);
      float arrival=smoothstep(.72,1.0,local);
      pos.xy += aTarget.xy * (ripple*.008 +sin(t*aMeta.z+phase)*.005)*arrival;
      pos.z += sin(t*aMeta.z*.75+phase)*.018*arrival;
      alpha*=smoothstep(0.0,.13,local);
      float linger=pow(max(0.0,1.0-local),1.4);
      size*=1.0+linger*.5;
    }
    float breath=1.0+sin(t*1.18)*.009*smoothstep(2.0,4.5,uElapsed);
    pos.xy*=breath;
    vec3 rotated=uRotation*pos;
    perspective=1.0/(1.0-rotated.z*.22);
    clip=vec2(rotated.x,-rotated.y)*uUnit*perspective*2.0/uViewport+vec2(0.0,.065);
     // Grazing key light and front/back attenuation create sculptural volume.
    float facing=smoothstep(-.86,.77,rotated.z);
    vec3 approxNormal=normalize(vec3(aTarget.x*.32, aTarget.y*.36, sign(aTarget.z)*.91));
    vec3 worldNormal=uRotation*approxNormal;
    float key=max(dot(worldNormal,normalize(vec3(-.42,-.35,.84))),0.0);
    float grazing=pow(1.0-abs(worldNormal.z),2.0);
    if(kind>4.5){
      // Ambient orbit responds to depth but should not inherit the heart skin's heavy back shadow.
      alpha*=.64+.36*smoothstep(-.75,.78,rotated.z);
      light*=.75;
    } else {
      alpha*=mix(.24,1.10,facing)*(.77+.38*key);
      light*=.68+.43*key+.19*grazing;
    }
    if(kind<.5 || (kind>3.5 && kind<4.5)){
      size*=1.075;
      // Click ripple is centered on the actual pointer location in screen space.
      if(uPulseAge>=0.0 && uPulseAge<1.65){
        float distanceToTap=length((clip-uPulseOrigin)*uViewport/(uUnit*2.0));
        float wave=exp(-pow((distanceToTap-uPulseAge*.91)*10.5,2.0));
        float pulse=wave*(1.0-smoothstep(.65,1.65,uPulseAge));
        alpha+=pulse*.31;
        size*=1.0+pulse*.62;
      }
      if(kind>3.5){
        glint=pow(max(0.0,sin(t*aMeta.z+phase)),16.0)*smoothstep(3.0,4.3,uElapsed);
        alpha*=.25+.98*glint;
        size*=.90+.30*glint;
      }
    }
  }
  vec3 base=palette(aMeta.w);
  // Keep the deepest layers cool while brightening the top-left catching edge.
  if(kind<.5 || (kind>3.5 && kind<4.5)){
    float pearly=clamp(.5-aTarget.x*.20-aTarget.y*.18,0.0,1.0);
    base=mix(base,vec3(.95,.82,1.0),pearly*.18);
  }
  if(kind>1.5 && kind<2.5) base=mix(base,vec3(.55,.45,.75),.27);
    if(kind>5.5 && kind<6.5) base=mix(base,vec3(.86,.92,1.0),.72);
    // Back-facing grains lose saturation so the front reads as a coherent surface.
   if(kind<.5 || (kind>3.5 && kind<4.5)){
     float nearFace=smoothstep(-.45,.80,(uRotation*aTarget).z);
     base=mix(base,vec3(.24,.15,.39),.48*(1.0-nearFace));
   }
  vColor=base*light;
  vAlpha=alpha;
  vGlint=glint;
  // World-space particles remain circular in screen space while sculpture rotates.
  vec2 delta=aCorner*size*perspective/uViewport;
  gl_Position=vec4(clip+delta,0.0,1.0);
}`;

  const fragmentSource = `#version 300 es
precision highp float;
in vec2 vUv;
in vec3 vColor;
in float vAlpha;
in float vGlint;
in float vKind;
out vec4 outColor;
void main(){
  float r2=dot(vUv,vUv);
  if(r2>1.0) discard;
  float core=exp(-r2*19.0);
  float haze=exp(-r2*4.2);
  float falloff=1.0-smoothstep(.55,1.0,r2);
  float opacity=(.78*core+.22*haze)*falloff*vAlpha;
  vec3 color=vColor*(.72+.40*core);
  if(vKind>5.5 && vKind<6.5){
    float bokeh=smoothstep(1.0,0.0,r2);
    opacity=(.18*core+.82*haze)*bokeh*vAlpha;
    color=mix(vColor,vColor*1.18,.45+.25*haze);
  }
  // Sparse four-point crystalline accents, only visible at glint peaks.
  if(vGlint>.01){
    float horizontal=exp(-abs(vUv.y)*25.0)*pow(max(0.0,1.0-abs(vUv.x)),5.0);
    float vertical=exp(-abs(vUv.x)*25.0)*pow(max(0.0,1.0-abs(vUv.y)),5.0);
    opacity+=(horizontal+vertical)*.19*vGlint*vAlpha;
  }
  outColor=vec4(color,opacity);
}`;

  const backgroundVertex = `#version 300 es
precision highp float;
const vec2 pts[3]=vec2[3](vec2(-1.0,-1.0),vec2(3.0,-1.0),vec2(-1.0,3.0));
void main(){gl_Position=vec4(pts[gl_VertexID],0.0,1.0);}`;

  const backgroundFragment = `#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
out vec4 outColor;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash(i), b=hash(i+vec2(1.0,0.0)), c=hash(i+vec2(0.0,1.0)), d=hash(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float value=0.0, amp=.55;
  for(int i=0;i<2;i++){
    value+=amp*noise(p);
    p=mat2(1.7,1.2,-1.2,1.7)*p+vec2(5.2,1.3);
    amp*=.5;
  }
  return value;
}
void main(){
  vec2 uv=(gl_FragCoord.xy/uResolution-.5);
  uv.x*=uResolution.x/uResolution.y;
  float halo=exp(-dot(uv-vec2(0.0,.035),uv-vec2(0.0,.035))*5.5);
  float mauve=exp(-dot((uv-vec2(.22,-.1))*vec2(1.3,1.6),(uv-vec2(.22,-.1))*vec2(1.3,1.6))*10.0);
  float below=exp(-dot((uv-vec2(-.06,-.40))*vec2(.9,1.8),(uv-vec2(-.06,-.40))*vec2(.9,1.8))*7.0);
  float vault=exp(-dot((uv-vec2(-.06,.12))*vec2(.80,1.14),(uv-vec2(-.06,.12))*vec2(.80,1.14))*6.4);
  float floorGlow=exp(-pow(uv.x/.51,2.0)*2.7-pow((uv.y+.405)/.065,2.0)*1.4);
  vec2 drift=uv*vec2(1.35,1.65);
  float cloudA=fbm(drift*1.85+vec2(uTime*.020,-uTime*.012));
  float cloudB=fbm(drift*2.45+vec2(-uTime*.016,uTime*.019));
  // Mist now occupies a visible range of FBM instead of being almost entirely clipped.
  float veilA=smoothstep(.19,.43,cloudA-length(uv-vec2(-.12,.05))*.20);
  float veilB=smoothstep(.23,.47,cloudB-length(uv-vec2(.19,-.07))*.23);
  float mistA=exp(-pow((uv.y-.19*sin(uv.x*3.0+uTime*.075)-.06)/.115,2.0))
              * exp(-pow((uv.x+.20)/.65,2.0));
  float mistB=exp(-pow((uv.y+.13*sin(uv.x*3.7-uTime*.067)+.18)/.125,2.0))
              * exp(-pow((uv.x-.16)/.75,2.0));
  vec3 c=vec3(.022,.016,.034);
  c+=vec3(.045,.024,.067)*halo;
  c+=vec3(.028,.013,.035)*mauve;
  c+=vec3(.027,.010,.032)*below;
  c+=vec3(.012,.009,.018)*vault;
  c+=vec3(.048,.021,.061)*floorGlow;
  c+=vec3(.050,.040,.093)*veilA;
  c+=vec3(.038,.032,.083)*veilB;
  c+=vec3(.026,.026,.060)*mistA;
  c+=vec3(.021,.022,.049)*mistB;
  float vignette=1.0-smoothstep(.15,1.3,length(uv));
  c*=.73+.27*vignette;
  c+=(hash(gl_FragCoord.xy)-.5)*.0024;
  outColor=vec4(c,1.0);
}`;

  // Two three-dimensional luminous ribbons with separate back/front passes.
  // Their geometry is generated by gl_VertexID; no uploaded ribbon vertices.
  const ribbonVertex = `#version 300 es
precision highp float;
uniform vec2 uViewport;
uniform float uUnit;
uniform float uTime;
uniform float uElapsed;
uniform float uPass;
uniform mat3 uRotation;
out float vSide;
out float vOpacity;
out vec3 vTint;
const float TAU=6.28318530718;
vec3 orbit(float a,float lane){
  if(lane<.5){
    return vec3(1.39*cos(a), .55*sin(a)+.065, .59*sin(a)+.13*cos(a));
  }
  return vec3(1.70*cos(a), .77*sin(a)-.012, -.59*sin(a)+.20*cos(a));
}
vec2 project(vec3 p){
  vec3 r=uRotation*p;
  float depth=1.0/(1.0-r.z*.22);
  return vec2(r.x,-r.y)*uUnit*depth*2.0/uViewport+vec2(0.0,.065);
}
void main(){
  float lane=float(gl_InstanceID);
  float stepId=float(gl_VertexID/2);
  float t=stepId/192.0;
  float a=t*TAU+uTime*(lane<.5?.085:-.053)+(lane<.5?0.0:1.15);
  vec3 p=orbit(a,lane);
  vec3 rotated=uRotation*p;
  vec2 screen=project(p);
  vec2 screenNext=project(orbit(a+.009,lane));
  vec2 tangent=normalize((screenNext-screen)*uViewport+vec2(1e-6));
  vec2 normal=vec2(-tangent.y,tangent.x);
  float side=mod(float(gl_VertexID),2.0)*2.0-1.0;
  float widthPx=(lane<.5?9.0:7.0);
  gl_Position=vec4(screen+normal*(widthPx*side)/uViewport,0.0,1.0);
  float nearest=smoothstep(-.12,.18,rotated.z);
  float segment=(.38+.62*pow(max(0.0,sin(a*2.25+lane*1.6-uTime*.11)),2.0));
  float breathing=.83+.17*sin(uTime*.37+lane*2.0);

    catch(e){console.error(e);showError('WebGL 图形设备恢复失败，请刷新页面重试。');}
  });
  new ResizeObserver(resize).observe(canvas);
  try{
    if(initialize()){
      if(running)run();else {render();stop();}
    }
  }catch(e){
    console.error('[Violet/WebGL]',e);
    showError(`图形着色器初始化失败：${String(e.message).slice(0,160)}`);
  }
})();

</script>
</body>
