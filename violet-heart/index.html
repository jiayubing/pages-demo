<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080111"><meta name="description" content="An animated violet nebula heart, with blue-white stardust and graceful orbital trails. A lightweight WebGL study.">
<title>Violet Orbit · A nebula in motion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23b69aff' d='M16 28C-7 12 7-4 16 8 25-4 39 12 16 28'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=5">
<noscript><style>#fallback{opacity:1}.caption{opacity:1}</style></noscript>
</head>
<body>
<main id="scene" aria-label="An animated purple nebula heart with blue-white orbiting stardust">
<div id="fallback" aria-hidden="true"></div><canvas id="universe" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<header><a class="wordmark" href="#" aria-label="Violet Orbit home"><span class="mark" aria-hidden="true">✧</span> VIOLET ORBIT</a><span class="edition">A NEBULA IN MOTION <i></i></span></header>
<section class="caption" aria-label="About this animation"><p class="eyebrow">A LITTLE LIGHT, IN THE INFINITE</p><h1>Gravity, with a heart.</h1><p class="subtext">Violet clouds. Wandering stars. One quiet orbit.</p></section>
<footer>
<div class="controls" aria-label="Animation controls">
<button id="play" type="button" aria-label="Pause animation"><span id="play-icon" aria-hidden="true">Ⅱ</span><span id="play-label">Pause</span></button>
<div class="separator"></div>
<label class="slider-label">Motion<input id="speed" type="range" min="0.3" max="2" value="1" step="0.05" aria-label="Motion speed"></label>
<label class="slider-label">Glow<input id="glow" type="range" min="0.55" max="1.5" value="1" step="0.05" aria-label="Glow intensity"></label>
<div class="separator extra"></div>
<label class="quality-label"><span class="sr-only">Render quality</span><select id="quality" aria-label="Render quality"><option value="auto">Auto quality</option><option value="low">Low power</option><option value="high">High quality</option></select></label>
<button id="replay" type="button" aria-label="Replay entrance" title="Replay entrance"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M4 7a6.3 6.3 0 1 1-.2 5M4 3v4h4"/></svg></button>
<button id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.25"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m6 0h4v-4"/></svg></button>
</div>
<p id="hint">MOVE GENTLY · LET THE STARS FOLLOW</p>
<p id="notice" role="status" class="notice" hidden></p>
</footer>
</main>
<script src="universe.js?v=5" defer></script>
</body>
</html>
